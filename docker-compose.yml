services:
  english-app:
    build: .
    container_name: english-flashcards
    restart: unless-stopped
    ports:
      - "8086:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      - vocab_data:/app/data

volumes:
  vocab_data:
